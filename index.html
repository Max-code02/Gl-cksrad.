<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glücksrad Studio</title>
    <meta name="description" content="Glücksrad Studio – Erstelle und drehe individuelle Glücksräder mit realistischer Physik und Sounds." />
    <meta property="og:title" content="Glücksrad Studio" />
    <meta property="og:description" content="Glücksrad Studio – Erstelle und drehe individuelle Glücksräder!" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    
    <!-- SortableJS für Drag & Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <!-- Socket.IO Client -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        if (typeof io === 'undefined') {
            document.write('<script src="/socket.io/socket.io.js"><\/script>');
        }
    </script>

    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #131b2e;
            --bg-input: #1c263f;
            --border-color: #263354;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --danger: #f43f5e;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.15) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem 1.5rem;
        }

        .app-container {
            width: 100%;
            max-width: 1400px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* HEADER */
        header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
        }

        header h1 {
            font-size: clamp(2rem, 4.5vw, 3.2rem);
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.04em;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        /* HUB VIEW: GLÜCKSRÄDER & RAUMAUSWAHL */
        #hubView {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
        }

        .hub-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.2rem 1.8rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .hub-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-create-wheel {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 0.8rem 1.6rem;
            font-size: 0.95rem;
            font-weight: 800;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 8px 20px -5px rgba(236, 72, 153, 0.4);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-create-wheel:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px -5px rgba(236, 72, 153, 0.6);
        }

        .wheels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
            width: 100%;
        }

        .wheel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            box-shadow: var(--shadow-lg);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .wheel-card:hover {
            transform: translateY(-3px);
            border-color: rgba(99, 102, 241, 0.4);
        }

        .wheel-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.5rem;
        }

        .wheel-card-title {
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .wheel-badge {
            font-size: 0.75rem;
            font-weight: 800;
            padding: 0.25rem 0.6rem;
            border-radius: 8px;
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
            white-space: nowrap;
        }

        .mini-swatches-bar {
            display: flex;
            gap: 4px;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
        }

        .mini-swatch {
            flex: 1;
            height: 100%;
            border-radius: 2px;
        }

        .wheel-card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 0.6rem;
        }

        .room-id-tag {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .wheel-card-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.4rem;
        }

        .btn-card-start {
            flex: 1;
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
        }

        .btn-card-start:hover {
            opacity: 0.92;
            transform: scale(1.02);
        }

        .btn-card-edit, .btn-card-delete {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.75rem 0.9rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.15s ease;
        }

        .btn-card-edit:hover {
            color: #38bdf8;
            border-color: #38bdf8;
        }

        .btn-card-delete:hover {
            color: var(--danger);
            border-color: var(--danger);
        }

        /* WHEEL PLAY VIEW */
        #wheelView {
            display: none;
            flex-direction: column;
            gap: 1.5rem;
            width: 100%;
        }

        .wheel-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 1rem 1.5rem;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .btn-back-hub {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.55rem 1.1rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .btn-back-hub:hover {
            border-color: var(--accent-primary);
            color: #818cf8;
        }

        .active-wheel-header {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        /* DREHZEIT-STEUERUNG (PROMINENT & GEFIXT) */
        .duration-control-bar {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
            padding: 0.4rem 0.8rem;
            border-radius: 14px;
            flex-wrap: wrap;
        }

        .duration-label {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .duration-input {
            width: 55px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: #ffffff;
            padding: 0.35rem 0.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 800;
            text-align: center;
            outline: none;
        }

        .duration-presets {
            display: flex;
            gap: 0.3rem;
        }

        .btn-duration-preset {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.35rem 0.6rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-duration-preset:hover, .btn-duration-preset.active {
            border-color: #6366f1;
            color: #ffffff;
            background: rgba(99, 102, 241, 0.25);
        }

        /* MAIN GRID (WHEEL + CONTROLS) */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            align-items: start;
        }

        @media (min-width: 950px) {
            .main-grid {
                grid-template-columns: 420px 1fr;
            }
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 1.8rem;
            box-shadow: var(--shadow-lg);
            backdrop-filter: blur(10px);
        }

        .controls-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }

        .controls-header h2 {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .btn-reset {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-reset:hover {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(244, 63, 94, 0.1);
        }

        .input-group {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1.2rem;
        }

        .input-group input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 0.8rem 1.1rem;
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input-group input:focus {
            border-color: var(--accent-primary);
        }

        .btn-add {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 0 1.3rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.4rem;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .btn-add:hover {
            background: var(--accent-hover);
        }

        .options-list {
            list-style: none;
            max-height: 480px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            padding-right: 0.3rem;
        }

        .option-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-input);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            transition: border-color 0.2s ease;
        }

        .option-item:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .drag-handle {
            cursor: grab;
            color: var(--text-secondary);
            margin-right: 10px;
            font-size: 1.1rem;
            user-select: none;
        }

        .option-content {
            display: flex;
            align-items: center;
            flex: 1;
            overflow: hidden;
        }

        .option-color-preview {
            width: 14px;
            height: 14px;
            border-radius: 4px;
            margin-right: 10px;
            flex-shrink: 0;
        }

        .option-text {
            flex: 1;
            font-weight: 600;
            font-size: 0.92rem;
            background: transparent;
            border: none;
            color: var(--text-primary);
            outline: none;
        }

        .option-text:focus {
            border-bottom: 1px solid var(--accent-primary);
        }

        .btn-delete {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.3rem;
            border-radius: 6px;
        }

        .btn-delete:hover {
            color: var(--danger);
        }

        /* WHEEL CANVAS AREA */
        .wheel-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 2rem 1.5rem;
        }

        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 620px;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.8rem;
        }

        .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 44px;
            height: 52px;
            z-index: 10;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
            pointer-events: none;
        }

        .pointer::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-top: 44px solid #f8fafc;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            cursor: pointer;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.6));
        }

        .btn-spin {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 1.2rem 4rem;
            font-size: 1.3rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 25px -5px rgba(236, 72, 153, 0.5);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .btn-spin:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 15px 30px -5px rgba(236, 72, 153, 0.7);
        }

        .btn-spin:disabled {
            filter: grayscale(0.7);
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(11, 15, 25, 0.88);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex !important;
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 2.2rem;
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
        }

        .form-input, .form-textarea {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
            line-height: 1.5;
            font-family: inherit;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .btn-modal-cancel {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.7rem 1.4rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-modal-save {
            background: var(--accent-gradient);
            color: white;
            border: none;
            padding: 0.7rem 1.8rem;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .winner-text {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 1rem 0;
            text-align: center;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- 1. HUB VIEW: AUSWAHL & VERWALTUNG ALLER GLÜCKSRÄDER -->
        <section id="hubView">
            <header>
                <h1>Glücksrad Studio</h1>
                <p>Wähle ein gespeichertes Glücksrad oder erstelle dein eigenes!</p>
            </header>

            <div class="hub-toolbar">
                <div class="hub-title">
                    <span>🎡 Deine Glücksräder</span>
                </div>
                <button id="btnCreateNewWheel" class="btn-create-wheel" onclick="if(window.openNewWheelModal)window.openNewWheelModal()">
                    ➕ Neues Glücksrad erstellen
                </button>
            </div>

            <!-- Liste / Raster aller Räder -->
            <div id="wheelsGrid" class="wheels-grid">
                <!-- Wird dynamisch aus Firebase / LocalStorage befüllt -->
            </div>
        </section>

        <!-- 2. WHEEL PLAY VIEW: DAS AKTIVE GLÜCKSRAD -->
        <section id="wheelView">
            <div class="wheel-top-bar">
                <button id="btnBackToHub" class="btn-back-hub" title="Zurück zur Auswahl">
                    ← Alle Räder
                </button>
                <div id="activeWheelTitle" class="active-wheel-header">
                    Standard Glücksrad
                </div>

                <!-- DREHZEIT STEUERUNG (WIE LANG SOLL ES DREHEN - GEFIXT) -->
                <div class="duration-control-bar">
                    <span class="duration-label">⏱️ Drehzeit:</span>
                    <input type="number" id="durationInput" class="duration-input" min="1" max="30" step="1" value="6" title="Drehzeit in Sekunden">
                    <span style="font-size: 0.8rem; color: var(--text-secondary);">Sek.</span>
                    <div class="duration-presets">
                        <button class="btn-duration-preset" data-sec="3">3s</button>
                        <button class="btn-duration-preset active" data-sec="6">6s</button>
                        <button class="btn-duration-preset" data-sec="10">10s</button>
                        <button class="btn-duration-preset" data-sec="15">15s</button>
                    </div>
                </div>
            </div>

            <main class="main-grid">
                <!-- Linke Seite: Steuerung & Optionen -->
                <section class="card">
                    <div class="controls-header">
                        <h2>Optionen (<span id="itemCount">16</span>)</h2>
                        <button id="resetBtn" class="btn-reset" title="Standard-Optionen laden">Zurücksetzen</button>
                    </div>

                    <form id="addForm" class="input-group" onSubmit="return false;">
                        <input type="text" id="optionInput" placeholder="Neuer Eintrag..." autocomplete="off" maxlength="35">
                        <button type="submit" id="addBtn" class="btn-add" title="Hinzufügen">+</button>
                    </form>

                    <ul id="optionsList" class="options-list">
                        <!-- Wird dynamisch gerendert -->
                    </ul>
                </section>

                <!-- Rechte Seite: Rad Canvas -->
                <section class="card wheel-section">
                    <div class="wheel-wrapper">
                        <div class="pointer"></div>
                        <canvas id="wheelCanvas" width="800" height="800"></canvas>
                    </div>
                    <button id="spinBtn" class="btn-spin">DREHEN</button>
                </section>
            </main>
        </section>

    </div>

    <!-- MODAL: RAD ERSTELLEN ODER BEARBEITEN -->
    <div id="wheelModal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="wheelModalTitle" class="modal-title">➕ Neues Glücksrad</h2>
            <form id="wheelForm">
                <div class="form-group">
                    <label for="wheelTitleInput">Name des Glücksrads:</label>
                    <input type="text" id="wheelTitleInput" class="form-input" placeholder="z.B. Gewinnspiel Klasse 8a" required maxlength="40">
                </div>
                <div class="form-group">
                    <label for="wheelIdInput">Raum-Code (ID):</label>
                    <input type="text" id="wheelIdInput" class="form-input" placeholder="z.B. klasse8a" required maxlength="30">
                </div>
                <div class="form-group">
                    <label for="wheelOptionsTextarea">Optionen (1 pro Zeile):</label>
                    <textarea id="wheelOptionsTextarea" class="form-textarea" placeholder="Option 1&#10;Option 2&#10;Option 3" required></textarea>
                </div>
                <div class="form-group">
                    <label for="wheelDurationInput">Standard-Drehzeit (Sekunden):</label>
                    <input type="number" id="wheelDurationInput" class="form-input" min="1" max="30" value="6" required>
                </div>
                <div class="modal-actions">
                    <button type="button" id="btnCloseWheelModal" class="btn-modal-cancel" onclick="if(window.closeNewWheelModal)window.closeNewWheelModal()">Abbrechen</button>
                    <button type="submit" class="btn-modal-save">Speichern & Starten</button>
                </div>
            </form>
        </div>
    </div>

    <!-- GEWINNER MODAL -->
    <div id="winnerModal" class="modal-overlay">
        <div class="modal-card" style="text-align: center;">
            <div style="font-size: 0.9rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase;">
                🎉 Wir haben einen Gewinner
            </div>
            <div id="winnerText" class="winner-text">Option</div>
            <button id="closeModalBtn" class="btn-card-start" style="width: 100%;">Weitermachen</button>
        </div>
    </div>

    <!-- SortableJS Initialisierung -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var el = document.getElementById('optionsList');
            if (el && typeof Sortable !== 'undefined') {
                Sortable.create(el, {
                    handle: '.drag-handle',
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    onEnd: function (evt) {
                        // Handled in main-wheel
                    }
                });
            }
        });
    </script>

    <!-- App Engine mit Firebase & Realtime Sync -->
    <script type="module" src="/src/main-wheel.ts"></script>
</body>
</html>
